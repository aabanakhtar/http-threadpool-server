<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elegant Minimal Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.35), transparent 70%);
      border-radius: 50%;
      filter: blur(30px);
      z-index: 0;
    }

    .glow.one {
      top: -120px;
      left: -100px;
    }

    .glow.two {
      bottom: -150px;
      right: -120px;
      background: radial-gradient(circle, rgba(56,189,248,0.25), transparent 70%);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(90%, 700px);
      padding: 4rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      line-height: 1.05;
      margin-bottom: 1.25rem;
      letter-spacing: -0.05em;
    }

    p {
      font-size: 1.1rem;
      color: #cbd5e1;
      line-height: 1.7;
      max-width: 550px;
      margin: 0 auto 2rem;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 0.95rem 1.7rem;
      border-radius: 14px;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .primary {
      background: #6366f1;
      color: white;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
    }

    .primary:hover {
      transform: translateY(-2px);
      background: #7c7ff7;
    }

    .secondary {
      border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0;
      background: rgba(255,255,255,0.05);
    }

    .secondary:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.1);
    }

    @media (max-width: 640px) {
      .card {
        padding: 2.5rem 1.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="card">
    <div class="badge">Minimal • Modern • Elegant</div>

    <h1>Build Something Beautiful</h1>

    <p>
      A clean and modern landing page with subtle glassmorphism,
      soft gradients, and responsive design — perfect as a starting
      point for your next project.
    </p>

    <div class="buttons">
      <a href="#" class="btn primary">Get Started</a>
      <a href="#" class="btn secondary">Learn More</a>
    </div>
  </div>
</body>
</html>
